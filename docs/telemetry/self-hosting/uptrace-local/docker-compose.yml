##
## Minimal docker-compose for local Uptrace testing.
## Brings up ClickHouse, PostgreSQL, Redis, and Uptrace -- nothing else.
##

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: on-failure
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_PASSWORD: uptrace
      CLICKHOUSE_DB: uptrace
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:8123/ping']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ch_data:/var/lib/clickhouse

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: uptrace
      POSTGRES_PASSWORD: uptrace
      POSTGRES_DB: uptrace
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uptrace -d uptrace']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata

  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  uptrace:
    image: uptrace/uptrace:2.0.3
    restart: on-failure
    volumes:
      - ./config.yml:/etc/uptrace/config.yml
    ports:
      - '14317:4317'
      - '14318:80'
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ch_data:
  pg_data:
