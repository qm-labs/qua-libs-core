name: Publish release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish (e.g. v0.1.0). Must match qua_libs_core.__version__."
        required: true
        type: string

concurrency:
  group: release-pypi-${{ github.workflow }}-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
        run: uv run python scripts/check_release_version.py

  build-from-release:
    name: build-from-release
    if: github.event_name == 'release'
    needs: verify-version
    uses: ./.github/workflows/reusable-build.yaml
    with:
      ref: ${{ github.event.release.tag_name }}

  build-manual:
    name: build-manual
    if: github.event_name == 'workflow_dispatch'
    needs: verify-version
    uses: ./.github/workflows/reusable-build.yaml
    with:
      ref: ${{ inputs.ref }}

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs: [build-from-release, build-manual]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: python-package-*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
