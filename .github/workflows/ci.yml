name: ci

# Baseline CI: black formatting gate (mirrors the original qua-libs check),
# adapted to uv. Self-contained; this repo no longer builds a package. ruff is
# available as a dev tool (config in pyproject.toml) but, as in the modality
# repos, the tutorial code is not gated (it uses the QUA `import *` idiom).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uvx --from "black>=24.3,<25" black --check --diff .
