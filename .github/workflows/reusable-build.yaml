name: Build python package

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: Git ref to checkout (tag or branch)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-package-sdist
          path: dist/qua_libs_core-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-package-wheel
          path: dist/qua_libs_core-*.whl
          if-no-files-found: error
          retention-days: 14
