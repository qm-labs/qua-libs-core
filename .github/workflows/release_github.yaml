name: Create GitHub draft release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to a draft release (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-github-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: |
          uv sync
          uv run pytest

  verify-version:
    name: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: uv run python scripts/check_release_version.py

  build:
    name: build
    needs: [test, verify-version]
    uses: ./.github/workflows/reusable-build.yaml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build-installer:
    name: build-installer (${{ matrix.os }})
    needs: [test, verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip_name: QUA-Libraries-Installer-windows.zip
          - os: ubuntu-latest
            zip_name: QUA-Libraries-Installer-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build installer
        run: python tools/installer/build_installer.py
      - name: Zip installer folder
        env:
          ZIP_NAME: ${{ matrix.zip_name }}
        run: |
          python -c "import os, shutil; from pathlib import Path; src = Path('tools/installer/dist/QUA-Libraries-Installer'); shutil.make_archive(str(src.parent / Path(os.environ['ZIP_NAME']).stem), 'zip', root_dir=src.parent, base_dir=src.name)"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: tools/installer/dist/${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: github-release
    needs: [build, build-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: python-package-*

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: installer-*

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: uv run python scripts/changelog_release_notes.py "$RELEASE_TAG" > release-notes.md

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
