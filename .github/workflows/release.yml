name: release

# Publishes qua-libs-core to PyPI using PyPI Trusted Publishing (OIDC) — no API
# tokens are stored anywhere. Authentication is the GitHub OIDC identity, which
# PyPI verifies against a Trusted Publisher you configure once (see below).
#
# Triggers:
#   - push a tag matching v*  -> build and publish to PyPI (real release)
#   - "Run workflow" (manual) -> build and publish to TestPyPI (dry-run)
#
# To cut a real release (run these yourself; this repo's CI never tags):
#   git tag v0.1.0
#   git push origin v0.1.0
# The tag value becomes the package version via hatch-vcs (tag v0.1.0 -> 0.1.0).
#
# One-time setup on PyPI/TestPyPI (Trusted Publisher), for each index:
#   PyPI Project -> Settings -> Publishing -> Add a GitHub publisher:
#     Owner:        qua-platform
#     Repository:   qua-libs-core
#     Workflow:     release.yml
#     Environment:  pypi   (and "testpypi" for the TestPyPI publisher)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from the tag; full history needed.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        run: uv build
      - name: Show built version
        run: ls -l dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI (dry-run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # dev builds may repeat a version across re-runs; don't fail on that.
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
