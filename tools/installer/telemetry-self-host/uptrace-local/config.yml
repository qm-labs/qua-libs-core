##
## Minimal Uptrace config for local testing.
## Runs with the bundled ClickHouse + PostgreSQL + Redis containers
## started by docker-compose (no external infrastructure needed).
##

service:
  env: development
  secret: local-dev-secret-change-me

site:
  url: http://localhost:14318
  ingest_url: http://localhost:14318?grpc=14317

listen:
  http:
    addr: :80
  grpc:
    addr: :4317

auth: {}

seed_data:
  update: true
  delete: true

  users:
    - key: user1
      name: Admin
      email: admin@example.com
      password: admin
      email_confirmed: true

  user_tokens:
    - key: user_token1
      user_key: user1
      token: user1_secret

  orgs:
    - key: org1
      name: LocalOrg

  org_users:
    - key: org_user1
      org_key: org1
      user_key: user1
      role: owner

  projects:
    - key: project1
      name: LocalProject
      org_key: org1

  project_tokens:
    - key: project_token1
      project_key: project1
      token: project1_secret

  project_users:
    - key: project_user1
      project_key: project1
      org_user_key: org_user1
      perm_level: admin

ch_cluster:
  cluster: uptrace1
  replicated: false
  distributed: false
  shards:
    - replicas:
        - addr: clickhouse:9000
          database: uptrace
          user: uptrace
          password: uptrace

pg:
  addr: postgres:5432
  user: uptrace
  password: uptrace
  database: uptrace

ch_schema:
  compression: ZSTD(1)
  spans_index:  { storage_policy: default }
  spans_data:   { storage_policy: default }
  span_links:   { storage_policy: default }
  logs_index:   { storage_policy: default }
  logs_data:    { storage_policy: default }
  events_index: { storage_policy: default }
  events_data:  { storage_policy: default }
  metrics:      { storage_policy: default }

redis_cache:
  addrs:
    1: redis:6379
  username: ""
  password: ""
  db: 0

certmagic:
  enabled: false

mailer:
  smtp:
    enabled: false

alerting: {}
service_graph: {}
sourcemaps: {}

self_monitoring:
  dsn: http://project1_secret@uptrace:80?grpc=4317

logging:
  level: INFO
