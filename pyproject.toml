# qua-libs-core: generic QUA tutorials, shared tooling, and the `qua_libs_core`
# package (including `qua_libs_core.telemetry` for modality repositories).

[project]
name = "qua-libs-core"
dynamic = ["version"]
description = "Generic QUA tutorials and shared libraries for modality-specific qua-libs repos"
license = { file = "LICENSE" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.13"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "uptrace>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
tutorials = [
    "qm-qua>=1.2.0",
    "qualang-tools>=0.19.0",
    "qm-saas",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "qua_libs_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qua_libs_core"]

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1", "pytest>=8.0", "pre-commit>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `from qm.qua import *` is the idiomatic QUA style (F403/F405); single-letter
# names like I/Q/l are standard in physics code (E741). Ignoring these keeps
# ruff's output useful. Run locally with: uv run ruff check .
ignore = ["F403", "F405", "E741"]
