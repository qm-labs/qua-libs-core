# qua-libs-core is the entry-point repo for the modality-split qua-libs: it holds
# the generic, modality-agnostic QUA tutorials and is the landing page for the
# per-modality repos. It also ships the importable `qua_libs_core` package, whose
# `qua_libs_core.telemetry` subpackage is shared OpenTelemetry + Uptrace
# instrumentation consumed by the per-modality repos.
#
# Runtime dependencies are derived from the imports the Tutorials actually use,
# plus the shared `telemetry` package's OpenTelemetry/Uptrace stack. Telemetry is
# off by default at runtime, so the libraries being installed never sends data.

[project]
name = "qua-libs-core"
dynamic = ["version"]
description = "Generic QUA tutorials and landing page for the modality-split qua-libs"
license = { file = "LICENSE" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.13"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "qm-qua>=1.2.0",
    "qualang-tools>=0.19.0",
    "qm-saas",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
    # Telemetry stack for the shared `telemetry` package. Regular deps (not an
    # extra): the heavy piece — grpcio/protobuf — is already pulled in by qm-qua,
    # so these add only small pure-Python wrappers. Telemetry is off by default at
    # runtime (TelemetryConfig.enabled), so installing them never emits anything.
    "uptrace>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "qua_libs_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qua_libs_core"]

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1", "pytest>=8.0"]

[tool.pytest.ini_options]
# Tests live outside the `telemetry` package so they are not shipped in the wheel.
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `from qm.qua import *` is the idiomatic QUA style (F403/F405); single-letter
# names like I/Q/l are standard in physics code (E741). Ignoring these keeps
# ruff's output useful. Run locally with: uv run ruff check .
ignore = ["F403", "F405", "E741"]
