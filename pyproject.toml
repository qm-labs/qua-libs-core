# qua-libs-core is the entry-point repo for the modality-split qua-libs: it holds
# the generic, modality-agnostic QUA tutorials and is the landing page for the
# per-modality repos. It is NOT an installable package. `package = false` is the
# uv-native equivalent of the original qua-libs Poetry `package-mode = false`.
#
# Runtime dependencies are derived from the imports the Tutorials actually use.

[project]
name = "qua-libs-core"
version = "0"
description = "Generic QUA tutorials and landing page for the modality-split qua-libs"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "qm-qua>=1.2.0",
    "qualang-tools>=0.19.0",
    "qm-saas",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `from qm.qua import *` is the idiomatic QUA style (F403/F405); single-letter
# names like I/Q/l are standard in physics code (E741). Ignoring these keeps
# ruff's output useful. Run locally with: uv run ruff check .
ignore = ["F403", "F405", "E741"]
