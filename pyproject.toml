# qua-libs-core: generic QUA tutorials, shared tooling, and the `qua_libs_core`
# package (including `qua_libs_core.telemetry` for modality repositories).

[project]
name = "qua-libs-core"
dynamic = ["version"]
description = "Generic QUA tutorials and shared libraries for modality-specific qua-libs repos"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.15"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "uptrace>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
tutorials = [
    "qm-qua>=1.2.0",
    "qualang-tools>=0.19.0",
    "qm-saas",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
]

[project.urls]
Homepage = "https://github.com/qua-platform/qua-libs-core"
Documentation = "https://github.com/qua-platform/qua-libs-core/tree/main/docs"
Repository = "https://github.com/qua-platform/qua-libs-core"
Issues = "https://github.com/qua-platform/qua-libs-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "qua_libs_core/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["qua_libs_core"]

[tool.hatch.build.targets.wheel]
packages = ["qua_libs_core"]

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1", "pytest>=8.0", "pre-commit>=4.0", "mypy>=1.11,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Run from the repo root so modules resolve as qua_libs_core.telemetry.*, not as
# top-level files: uv run --group dev mypy qua_libs_core
files = ["qua_libs_core"]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# uptrace ships no py.typed marker, so its public API is untyped through no fault
# of ours. tomli is a python<3.11 conditional dependency, so it is absent from a
# 3.11+ dev environment even though python_version=3.10 makes mypy check the
# branch that imports it. Scoped per-module rather than a global ignore.
module = ["uptrace", "tomli"]
ignore_missing_imports = true

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `from qm.qua import *` is the idiomatic QUA style (F403/F405); single-letter
# names like I/Q/l are standard in physics code (E741). Ignoring these keeps
# ruff's output useful. Run locally with: uv run ruff check .
ignore = ["F403", "F405", "E741"]
