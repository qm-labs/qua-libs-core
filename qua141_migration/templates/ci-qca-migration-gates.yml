name: qca-migration-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qca-migration-gates:
    name: QCA migration grep gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qua-libs-core kit
        uses: actions/checkout@v4
        with:
          repository: qua-platform/qua-libs-core
          ref: QL-1212-qua141-py314
          path: .qua-libs-core
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        run: uv sync --python 3.14
      - name: Run portable QCA migration gates
        env:
          QCA_MODALITY: "MODALITY_PLACEHOLDER"
          QCA_REPO: ${{ github.workspace }}
        run: uv run pytest .qua-libs-core/qua141_migration/tests/test_qca_migration_gates.py -q
